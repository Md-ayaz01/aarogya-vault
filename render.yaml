services:
  - type: web
    name: aarogya-vault-api
    env: python
    rootDir: backend
    buildCommand: pip install --no-cache-dir --upgrade pip && pip uninstall -y passlib || true && pip install --no-cache-dir --upgrade --force-reinstall -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.0
