<style>@keyframes fade-up {
    0% {
        opacity: 0;
        transform: translateY(10px);
        } 100% {
        opacity: 1;
        transform: translateY(0);
        }
    }
@keyframes pulse-soft {
    0%, 100% {
        opacity: 1;
        } 50% {
        opacity: 0.7;
        }
    }
@keyframes grain {
    0%, 100% {
        transform: translate(0, 0);
        } 10% {
        transform: translate(-5%, -10%);
        } 20% {
        transform: translate(-15%, 5%);
        } 30% {
        transform: translate(7%, -25%);
        } 40% {
        transform: translate(-5%, 25%);
        } 50% {
        transform: translate(-15%, 10%);
        } 60% {
        transform: translate(15%, 0%);
        } 70% {
        transform: translate(0%, 15%);
        } 80% {
        transform: translate(3%, 35%);
        } 90% {
        transform: translate(-10%, 10%);
        }
    }
.animate-fade-up {
    animation: fade-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards
    }
.animate-delay-1 {
    animation-delay: 0.2s
    }
.animate-delay-2 {
    animation-delay: 0.4s
    }
/* Medical watermark background pattern */

<script>
        // Simulate app initialization loading
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            
            // Initial delay then fill
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 300);

            // Micro-interaction: Subtle mouse parallax on the glows
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                
                const glows = document.querySelectorAll('.bg-primary-fixed-dim, .bg-secondary-container');
                glows.forEach((glow, idx) => {
                    const speed = (idx + 1) * 20;
                    glow.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
                });
            });
        });
    </script>
