    <style>
        :root { --primary: #006B53; --primary-container: #00A884; --primary-fixed: #79F9D0; --bg-dark: #0F172A; --card-dark: #1E293B; --text-light: #F8FAFC; --text-muted: #94A3B8; --border: rgba(188, 202, 194, 0.2); }

        body { background: var(--bg-dark); color: var(--text-light); display: flex; min-height: 100vh; }
        aside { width: 280px; background: var(--card-dark); border-right: 1px solid var(--border); display: flex; flex-direction: column; }

        .brand-sub { font-size: 10px; color: rgba(255,255,255,0.7); letter-spacing: 1.5px; font-weight: 700; }
        .nav-list { list-style: none; padding: 16px 0; overflow-y: auto; flex: 1; }
        .nav-item a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; border-left: 4px solid transparent; }
        .nav-item.active a { background: rgba(0, 107, 83, 0.2); color: var(--primary-fixed); border-left-color: var(--primary-fixed); font-weight: 600; }
        main { flex: 1; padding: 32px; overflow-y: auto; }
        .user-card { background: var(--card-dark); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
